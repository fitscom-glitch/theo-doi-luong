name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Tao khung du an Android
        run: flutter create --platforms=android --project-name theo_doi_luong app

      - name: Chep ma nguon va font
        run: |
          mkdir -p app/assets/fonts
          cp main.dart app/lib/main.dart
          cp pubspec.yaml app/pubspec.yaml
          cp LiberationSans-Regular.ttf LiberationSans-Bold.ttf app/assets/fonts/
          rm -f app/test/widget_test.dart

      - name: Tai package
        working-directory: app
        run: flutter pub get

      - name: Build APK
        working-directory: app
        run: flutter build apk --release --no-shrink

      - uses: actions/upload-artifact@v4
        with:
          name: theo-doi-luong-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
dependency_overrides:
  shared_preferences_android: 2.4.28
